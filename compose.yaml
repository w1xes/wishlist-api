# Full Wishlist stack: Postgres, Redis, API and UI.
#   docker compose up -d --build --wait
# Secrets come from .env (not committed, see .env.example). There are no password defaults.
name: wishlist

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wishlist
      POSTGRES_DB: wishlist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Copy .env.example to .env and replace the placeholder}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
    image: wishlist-api:local
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: wishlist
      POSTGRES_DB: wishlist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Copy .env.example to .env and replace the placeholder}
      REDIS_URL: redis://redis:6379/0
      UI_ORIGIN: ${UI_ORIGIN:-http://localhost:${UI_PORT:-8081},http://127.0.0.1:${UI_PORT:-8081}}
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  ui:
    build:
      # By default the UI is built from the main branch of the public wishlist-ui repository,
      # so a clone of this repository alone is enough. UI_CONTEXT=../wishlist-ui builds a local clone.
      context: ${UI_CONTEXT:-https://github.com/w1xes/wishlist-ui.git#main}
      args:
        # Baked into the JS bundle at build time. It is the address the browser uses, not the
        # address of the container, so it points to the published API port on the host.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:${API_PORT:-8000}}
    image: wishlist-ui:local
    restart: unless-stopped
    ports:
      - '127.0.0.1:${UI_PORT:-8081}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/']
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s

  # ---- Development profile: docker compose --profile dev up -d --build --wait ----
  # Code changes appear without rebuilding images. Uses the same Postgres and Redis.

  api-dev:
    profiles: [dev]
    build:
      context: .
    image: wishlist-api-dev:local
    restart: unless-stopped
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --reload, --reload-dir, app]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: wishlist
      POSTGRES_DB: wishlist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Copy .env.example to .env and replace the placeholder}
      REDIS_URL: redis://redis:6379/0
      UI_ORIGIN: ${UI_DEV_ORIGIN:-http://localhost:5174,http://127.0.0.1:5174}
    ports:
      - '127.0.0.1:${API_DEV_PORT:-8100}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    develop:
      watch:
        # Code edits are copied into the running container, uvicorn --reload picks them up.
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - __pycache__/
        # New or changed dependencies need a new image.
        - action: rebuild
          path: ./requirements.txt

  ui-dev:
    profiles: [dev]
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      # Sources of the UI repo from the host.
      - ${UI_DEV_PATH:-../wishlist-ui}:/app
      # A volume over node_modules hides the host's node_modules (absent, or built for Windows
      # or macOS) and keeps the Linux packages installed by npm ci inside the container.
      - ui_dev_node_modules:/app/node_modules
    environment:
      VITE_API_BASE: ${VITE_DEV_API_BASE:-http://localhost:8100}
      # Bind mounts from Windows and macOS hosts do not deliver file system events.
      CHOKIDAR_USEPOLLING: 'true'
    command: [sh, -ec, 'npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5174 --strictPort']
    ports:
      - '127.0.0.1:${UI_DEV_PORT:-5174}:5174'
    depends_on:
      api-dev:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:5174/']
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 60s

volumes:
  pgdata:
  ui_dev_node_modules:
