name: API CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  lint:
    name: API lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          version: '0.15.2'

  tests:
    name: API tests (Python ${{ matrix.python }})
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      POSTGRES_PASSWORD: wishlist-test-only
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wishlist
          POSTGRES_PASSWORD: wishlist-test-only
          POSTGRES_DB: wishlist
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U wishlist -d wishlist"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Cache Python wheels
        id: wheels
        uses: actions/cache@v5
        with:
          path: .wheelhouse
          key: wheels-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}-${{ hashFiles('requirements-dev.txt') }}
      - name: Download dependency wheels
        if: steps.wheels.outputs.cache-hit != 'true'
        run: |
          python -m pip download --only-binary=:all: --dest .wheelhouse -r requirements-dev.txt
      - name: Install locked dependencies offline
        run: python -m pip install --no-index --find-links .wheelhouse -r requirements-dev.txt
      - name: Test against Postgres and Redis
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: api-coverage-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  image:
    name: API image
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU for arm64
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  scan:
    name: API image scan
    continue-on-error: true
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: wishlist-api:scan
          cache-from: type=gha
          provenance: false
          sbom: false
      - name: Trivy report (table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wishlist-api:scan
          format: table
          output: trivy-report.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Trivy report (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wishlist-api:scan
          format: json
          output: trivy-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Summarize findings by source
        if: always()
        run: |
          [ -f trivy-report.json ] || exit 0
          {
            echo '### Trivy findings by source'
            echo
            echo '| Class | Target | Findings |'
            echo '| --- | --- | --- |'
            jq -r '.Results[]? | "| \(.Class) | \(.Target) | \((.Vulnerabilities // []) | length) |"' trivy-report.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-trivy-report
          path: |
            trivy-report.txt
            trivy-report.json
          if-no-files-found: ignore
